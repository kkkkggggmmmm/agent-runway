app = "agent-runway-mobile-change-me"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  AGENT_RUNWAY_DATA_DIR = "/home/agentrunway/state"

[mounts]
  source = "agent_runway_state"
  destination = "/home/agentrunway"
  initial_size = "1gb"
  snapshot_retention = 7

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
