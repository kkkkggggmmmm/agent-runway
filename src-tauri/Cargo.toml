[package]
name = "agent-runway"
version = "0.3.0"
description = "Native Work + Codex quota runway dashboard"
authors = ["DWDAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agent_runway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.8"
include_dir = "0.7"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
